name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HEADVER_HEAD: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Enable Nix cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G

      - name: Compute HeadVer version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          yearweek="$(date -u +'%g%V')"
          version="v${HEADVER_HEAD}.${yearweek}.${GITHUB_RUN_NUMBER}"

          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build with Nix
        run: nix build

      - name: Tidy build artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          cp result ChangseoJang_Resume.pdf
          echo 'path=ChangseoJang_Resume.pdf' >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            "$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
