name: "Release"
on:
 push:
  tags:
    - '*'

jobs:
  build:
    name: "Build and Release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v22
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build
      - uses: softprops/action-gh-release@v1
        with:
          files: result/cv.pdf
